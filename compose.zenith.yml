name: zenith

services:
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: zenith:local
    restart: unless-stopped
    init: true
    environment:
      BASE_URL: http://localhost:${ZENITH_PORT:-3100}
      SECRET_KEY: ${ZENITH_SECRET_KEY:?Run scripts/zenith.ps1 up first}
      DATABASE_URL: postgresql://zenith:${ZENITH_DB_PASSWORD:?Local database password required}@postgres:5432/zenith
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: zenith
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: zenith
      S3_SECRET_ACCESS_KEY: ${ZENITH_STORAGE_PASSWORD:?Local storage password required}
      S3_FORCE_PATH_STYLE: 'true'
      S3_PROXY: 'true'
      DISABLE_TELEMETRY: 'true'
      TRUSTED_PROXY_HOPS: '0'
      EMAIL_FROM: Zenith <noreply@localhost>
    ports:
      - '127.0.0.1:${ZENITH_PORT:-3100}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  postgres:
    build:
      context: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenith
      POSTGRES_PASSWORD: ${ZENITH_DB_PASSWORD:?Local database password required}
      POSTGRES_DB: zenith
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=zenith
    volumes:
      - database:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zenith -d zenith']
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: zenith
      MINIO_ROOT_PASSWORD: ${ZENITH_STORAGE_PASSWORD:?Local storage password required}
    command: server /data
    volumes:
      - files:/data
    healthcheck:
      test: ['CMD', 'silo', 'healthcheck', 'ready']
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    environment:
      MINIO_ROOT_USER: zenith
      MINIO_ROOT_PASSWORD: ${ZENITH_STORAGE_PASSWORD:?Local storage password required}
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'mc alias set local http://storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/zenith'
    restart: 'no'

volumes:
  database:
  files:
